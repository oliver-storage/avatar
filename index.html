<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Natal Vettore</title>
<style>
:root{--azul:#1d4ed8;--azul-esc:#1e3a8a;--azul-cl:#dbeafe;--fundo:#f1f5f9;--borda:#e2e8f0;--txt:#0f172a;--cinza:#64748b;--verm:#dc2626;--verde:#16a34a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--fundo);color:var(--txt);display:flex;min-height:100vh}
aside{width:210px;background:var(--azul-esc);color:#fff;display:flex;flex-direction:column;transition:width .2s;flex-shrink:0;position:sticky;top:0;height:100vh}
aside.min{width:62px}
aside .topo{display:flex;align-items:center;gap:10px;padding:16px 18px;font-weight:700;white-space:nowrap;overflow:hidden}
aside .topo button{background:none;border:0;color:#fff;font-size:20px;cursor:pointer}
aside nav button{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;color:#cbd5e1;padding:12px 20px;font-size:15px;cursor:pointer;white-space:nowrap;overflow:hidden;text-align:left}
aside nav button .ic{font-size:19px;width:22px;text-align:center;flex-shrink:0}
aside nav button.on,aside nav button:hover{background:var(--azul);color:#fff}
aside.min .rot{display:none}
main{flex:1;display:flex;flex-direction:column;min-width:0}
header{background:#fff;border-bottom:1px solid var(--borda);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
header h1{font-size:19px}
.barra{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--azul);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-size:14px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--azul-esc)}
.btn.sec{background:#fff;color:var(--azul);border:1px solid var(--azul)}
.btn.sec:hover{background:var(--azul-cl)}
.btn.peq{padding:6px 9px;font-size:12px}
.btn.perigo{background:#fff;color:var(--verm);border:1px solid #fecaca}
.conteudo{padding:22px 24px;flex:1}
.tela{display:none}.tela.on{display:block}
footer{text-align:center;font-size:12px;color:var(--cinza);padding:12px}
.drop{border:2px dashed #93c5fd;border-radius:12px;background:#fff;padding:26px;text-align:center;color:var(--cinza);cursor:pointer;margin-bottom:20px}
.drop.over{background:var(--azul-cl)}
.drop b{color:var(--azul)}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:#fff;border:1px solid var(--borda);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:9px}
.card .prev{background:#fff;border-radius:8px;height:260px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.card .prev img{max-width:100%;max-height:100%}
.card .aviso{font-size:12px;color:#b45309;background:#fef3c7;border-radius:6px;padding:5px 8px}
.card input[type=text]{width:100%;border:1px solid var(--borda);border-radius:8px;padding:8px;font-size:14px}
.chips{display:flex;gap:8px}
.chip{flex:1;border:1px solid var(--borda);border-radius:999px;padding:7px;text-align:center;cursor:pointer;font-size:13px;font-weight:600;user-select:none;background:#fff}
.chip.on.h{background:#dbeafe;border-color:var(--azul);color:var(--azul)}
.chip.on.m{background:#fce7f3;border-color:#db2777;color:#db2777}
.acoes{display:flex;gap:6px;flex-wrap:wrap}
.vazio{color:var(--cinza);text-align:center;padding:40px}
.resumo{color:var(--cinza);font-size:13px;margin-bottom:12px}
.fig{background:#fff;border:1px solid var(--borda);border-radius:10px;padding:8px;text-align:center;cursor:pointer}
.fig img{width:100%;height:170px;object-fit:contain}
.fig span{font-size:12px;font-weight:700}
.fig.sel{outline:3px solid var(--azul)}
.fig.usada{opacity:.55}
/* mural */
#muralBox{background:radial-gradient(circle at 50% 0,#1e40af,#0b1d4f 70%);border-radius:14px;padding:26px;color:#fff;position:relative;overflow:hidden;min-height:400px}
#muralBox:fullscreen{border-radius:0;overflow:auto}
#muralTit{font-size:34px;font-weight:800;text-align:center;margin-bottom:22px;text-shadow:0 2px 8px #0008;outline:none}
#muralGrade{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px;position:relative;z-index:1}
.mcard{background:#fff;border-radius:14px;padding:10px 8px 8px;text-align:center;color:var(--txt);box-shadow:0 6px 18px #0006}
.mcard img{width:100%;height:240px;object-fit:contain}
.mcard div{font-weight:700;font-size:15px;margin-top:4px;color:var(--verm)}
.neve{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(#fff 1.4px,transparent 1.6px),radial-gradient(#fff9 1px,transparent 1.2px);background-size:60px 60px,37px 37px;background-position:0 0,18px 22px;opacity:.35}
/* modal */
.modal{position:fixed;inset:0;background:#0f172acc;display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:14px;padding:18px;max-width:920px;width:100%;max-height:94vh;overflow:auto}
.mbox h2{font-size:17px;margin-bottom:12px}
.ajuste{display:flex;gap:18px;flex-wrap:wrap}
#cvAj{background:#fff;border:1px solid var(--borda);border-radius:10px;max-height:62vh;max-width:100%;cursor:grab;touch-action:none}
.ctrl{flex:1;min-width:220px;display:flex;flex-direction:column;gap:14px}
.ctrl label{font-size:13px;color:var(--cinza);display:flex;flex-direction:column;gap:4px}
.rodape-m{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
#status{position:fixed;bottom:16px;right:16px;background:var(--azul-esc);color:#fff;padding:10px 14px;border-radius:8px;font-size:13px;display:none;z-index:60}
@media print{aside,header,footer,.no-print{display:none!important}.conteudo{padding:0}#muralBox{border-radius:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<aside id="menu">
  <div class="topo"><button onclick="menu.classList.toggle('min')" title="Recolher menu">☰</button><span class="rot">🎄 Natal</span></div>
  <nav>
    <button data-t="colab" class="on" title="Colaboradores"><span class="ic">👥</span><span class="rot">Colaboradores</span></button>
    <button data-t="mural" title="Mural"><span class="ic">🎄</span><span class="rot">Mural</span></button>
    <button data-t="figs" title="Figurinhas"><span class="ic">🧝</span><span class="rot">Figurinhas</span></button>
  </nav>
</aside>
<main>
  <header>
    <h1 id="titulo">Colaboradores</h1>
    <div class="barra" id="barra"></div>
  </header>
  <div class="conteudo">
    <section class="tela on" id="t-colab">
      <div class="drop" id="drop"><b>Clique ou arraste as fotos dos colaboradores aqui</b><br><small>JPG/PNG · várias de uma vez · o nome vem do nome do arquivo (dá pra editar)</small></div>
      <input type="file" id="arq" accept="image/*" multiple hidden>
      <div class="resumo" id="resumo"></div>
      <div class="grade" id="lista"></div>
    </section>
    <section class="tela" id="t-mural">
      <div id="muralBox"><div class="neve"></div>
        <div id="muralTit" contenteditable="true" spellcheck="false">🎄 Feliz Natal! 🎄</div>
        <div id="muralGrade"></div>
      </div>
    </section>
    <section class="tela" id="t-figs">
      <div class="resumo" id="figResumo"></div>
      <div class="grade" id="figLista" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))"></div>
    </section>
  </div>
  <footer id="rodape"></footer>
</main>

<div class="modal" id="mAj"><div class="mbox">
  <h2 id="ajTit">Ajustar rosto</h2>
  <div class="ajuste">
    <canvas id="cvAj"></canvas>
    <div class="ctrl">
      <small style="color:var(--cinza)">Arraste a imagem para posicionar o rosto.</small>
      <label>Tamanho do rosto <input type="range" id="ajZoom" min="-100" max="100" value="0"></label>
      <label>Girar <input type="range" id="ajRot" min="-45" max="45" value="0"></label>
      <button class="btn sec" id="ajRedet">Detectar rosto de novo</button>
    </div>
  </div>
  <div class="rodape-m"><button class="btn sec" id="ajCanc">Cancelar</button><button class="btn" id="ajOk">Salvar</button></div>
</div></div>

<div class="modal" id="mFig"><div class="mbox">
  <h2 id="figTit">Escolher figurinha</h2>
  <div class="grade" id="figEsc" style="grid-template-columns:repeat(auto-fill,minmax(130px,1fr))"></div>
  <div class="rodape-m"><button class="btn sec" onclick="mFig.classList.remove('on')">Fechar</button></div>
</div></div>
<div id="status"></div>

const colabs=[]; let seq=0;

function status(t,ms){const s=$('status');s.textContent=t;s.style.display=t?'block':'none';if(ms)setTimeout(()=>s.style.display='none',ms);}

// ---------- detector de rosto (MediaPipe) ----------
let detector=null,detPromise=null;
function carregarDetector(){
  if(detPromise)return detPromise;
  detPromise=(async()=>{
    try{
      const v=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
      const fs=await v.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
      detector=await v.FaceDetector.createFromOptions(fs,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite',delegate:'CPU'},runningMode:'IMAGE',minDetectionConfidence:0.4});
    }catch(e){console.warn('Detector indisponível',e);detector=null;}
    return detector;
  })();
  return detPromise;
}
async function detectar(c){
  const d=await carregarDetector();
  const W=c.img.naturalWidth,H=c.img.naturalHeight;
  c.auto=false;
  if(d){
    try{
      const r=d.detect(c.img);
      if(r.detections&&r.detections.length){
        const best=r.detections.sort((a,b)=>b.boundingBox.width*b.boundingBox.height-a.boundingBox.width*a.boundingBox.height)[0];
        const b=best.boundingBox,k=best.keypoints||[];
        let rot=0;
        if(k.length>=2){const e1=k[0],e2=k[1];rot=Math.atan2((e2.y-e1.y)*H,(e2.x-e1.x)*W);if(Math.abs(rot)>Math.PI/2)rot+=rot>0?-Math.PI:Math.PI;}
        c.face={x:b.originX+b.width/2,y:b.originY+b.height*0.47,s:b.height*1.32,rot};
        c.auto=true;return;
      }
    }catch(e){console.warn(e);}
  }
  const m=Math.min(W,H);c.face={x:W/2,y:H*0.4,s:m*0.55,rot:0};
}

// ---------- composição ----------
function compor(c,canvas){
  const f=figPorId(c.fig);const W=f.w,H=f.h;
  const cv=canvas||document.createElement('canvas');cv.width=W;cv.height=H;
  const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,W,H);
  const [sx,sy,srx,sry]=f.slot;const cx=sx*W,cy=sy*H,rx=srx*W*1.08,ry=sry*H*1.08;
  // rosto em camada própria com borda suave
  const l=document.createElement('canvas');l.width=W;l.height=H;const lg=l.getContext('2d');
  const esc=(ry*2)/(c.face.s*Math.pow(2,c.zoom||0));
  lg.save();lg.translate(cx,cy);lg.rotate(-(c.face.rot)+(c.rotAj||0));lg.scale(esc,esc);
  lg.drawImage(c.img,-c.face.x,-c.face.y);lg.restore();
  lg.globalCompositeOperation='destination-in';
  lg.save();lg.translate(cx,cy);lg.scale(rx,ry);
  const gr=lg.createRadialGradient(0,0,0,0,0,1);gr.addColorStop(0,'#000');gr.addColorStop(0.88,'#000');gr.addColorStop(1,'rgba(0,0,0,0)');
  lg.fillStyle=gr;lg.beginPath();lg.arc(0,0,1,0,Math.PI*2);lg.fill();lg.restore();
  g.drawImage(l,0,0);
  g.drawImage(f.img,0,0,W,H);
  return cv;
}
function atualizarSaida(c){if(c.sexo&&c.fig&&c.face){c.out=compor(c).toDataURL('image/png');}else c.out=null;}

// ---------- sorteio ----------
function usoFig(id,exceto){return colabs.filter(o=>o!==exceto&&o.fig===id).length;}
function sortear(c){
  const pool=FIGS.filter(f=>f.sexo===c.sexo);if(!pool.length)return;
  let cand=pool.filter(f=>f.id!==c.fig);if(!cand.length)cand=pool;
  const min=Math.min(...cand.map(f=>usoFig(f.id,c)));
  cand=cand.filter(f=>usoFig(f.id,c)===min);
  c.fig=cand[Math.floor(Math.random()*cand.length)].id;
}

// ---------- fotos ----------
function nomeDoArquivo(n){return n.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').replace(/\s+/g,' ').trim().replace(/\b\w/g,l=>l.toUpperCase());}
function lerFoto(file){
  return new Promise(res=>{
    const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{
      const max=1400,s=Math.min(1,max/Math.max(im.width,im.height));
      if(s<1){const cv=document.createElement('canvas');cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);const im2=new Image();im2.onload=()=>res(im2);im2.src=cv.toDataURL('image/jpeg',0.9);}
      else res(im);
    };im.src=fr.result;};fr.readAsDataURL(file);
  });
}
async function adicionar(files){
  files=[...files].filter(f=>f.type.startsWith('image/'));if(!files.length)return;
  carregarDetector();
  for(const [i,file] of files.entries()){
    status(`Lendo fotos ${i+1}/${files.length}…`);
    const img=await lerFoto(file);
    const c={id:++seq,nome:nomeDoArquivo(file.name),img,sexo:null,fig:null,face:null,zoom:0,rotAj:0,out:null};
    colabs.push(c);
    await detectar(c);
    render();
  }
  status('');
}
$('drop').onclick=()=>$('arq').click();
$('arq').onchange=e=>{adicionar(e.target.files);e.target.value='';};
['dragover','dragenter'].forEach(ev=>$('drop').addEventListener(ev,e=>{e.preventDefault();$('drop').classList.add('over');}));
['dragleave','drop'].forEach(ev=>$('drop').addEventListener(ev,e=>{e.preventDefault();$('drop').classList.remove('over');}));
$('drop').addEventListener('drop',e=>adicionar(e.dataTransfer.files));

// ---------- render colaboradores ----------
function render(){
  const L=$('lista');
  const pend=colabs.filter(c=>!c.sexo).length;
  $('resumo').textContent=colabs.length?`${colabs.length} colaborador(es) · ${colabs.filter(c=>c.sexo==='H').length} H · ${colabs.filter(c=>c.sexo==='M').length} M`+(pend?` · ${pend} sem marcar H/M`:''):'';
  if(!colabs.length){L.innerHTML='<div class="vazio">Nenhuma foto ainda.</div>';return;}
  L.innerHTML='';
  colabs.forEach(c=>{
    if(c.sexo&&c.fig&&!c.out)atualizarSaida(c);
    const d=document.createElement('div');d.className='card';
    d.innerHTML=`
      <div class="prev">${c.out?`<img src="${c.out}">`:`<img src="${c.img.src}" style="opacity:.85">`}</div>
      ${!c.sexo?'<div class="aviso">Marque H ou M para sortear a figurinha</div>':''}
      ${c.sexo&&!c.auto?'<div class="aviso">Rosto não detectado automaticamente — use Ajustar</div>':''}
      <input type="text" value="${c.nome.replace(/"/g,'&quot;')}" placeholder="Nome">
      <div class="chips"><div class="chip h ${c.sexo==='H'?'on':''}" data-s="H">♂ Homem</div><div class="chip m ${c.sexo==='M'?'on':''}" data-s="M">♀ Mulher</div></div>
      <div class="acoes">${c.sexo?`<button class="btn sec peq" data-a="sort">🎲 Sortear outra</button><button class="btn sec peq" data-a="esc">🧝 Escolher</button><button class="btn sec peq" data-a="aj">✋ Ajustar</button><button class="btn sec peq" data-a="bx">⬇ Baixar</button>`:''}<button class="btn perigo peq" data-a="rem">Remover</button></div>`;
    d.querySelector('input').oninput=e=>{c.nome=e.target.value;};
    d.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{
      if(c.sexo===ch.dataset.s)return;c.sexo=ch.dataset.s;c.fig=null;sortear(c);atualizarSaida(c);render();});
    d.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{
      const a=b.dataset.a;
      if(a==='sort'){sortear(c);atualizarSaida(c);render();}
      if(a==='esc')abrirEscolha(c);
      if(a==='aj')abrirAjuste(c);
      if(a==='bx')baixarUm(c);
      if(a==='rem'&&confirm(`Remover ${c.nome||'esta foto'}?`)){colabs.splice(colabs.indexOf(c),1);render();}
    });
    L.appendChild(d);
  });
}

function baixarUm(c){if(!c.out)return;const a=document.createElement('a');a.download=(c.nome||'colaborador').trim().replace(/[\\/:*?"<>|]+/g,'')+'.png';a.href=c.out;a.click();}

// ---------- escolher figurinha ----------
function abrirEscolha(c){
  $('figTit').textContent=`Escolher figurinha — ${c.nome}`;
  const E=$('figEsc');E.innerHTML='';
  FIGS.filter(f=>f.sexo===c.sexo).forEach(f=>{
    const u=usoFig(f.id,c);
    const d=document.createElement('div');d.className='fig'+(f.id===c.fig?' sel':'')+(u?' usada':'');
    d.innerHTML=`<img src="${f.src}"><span>${f.id}${u?` · em uso (${u})`:''}</span>`;
    d.onclick=()=>{c.fig=f.id;atualizarSaida(c);render();$('mFig').classList.remove('on');};
    E.appendChild(d);
  });
  $('mFig').classList.add('on');
}

// ---------- ajuste manual ----------
let aj=null;
function abrirAjuste(c){
  aj={c,bk:{face:{...c.face},zoom:c.zoom,rotAj:c.rotAj,auto:c.auto}};
  $('ajTit').textContent=`Ajustar rosto — ${c.nome}`;
  $('ajZoom').value=Math.round((c.zoom||0)*-100);$('ajRot').value=Math.round((c.rotAj||0)*180/Math.PI);
  desenharAj();$('mAj').classList.add('on');
}
function desenharAj(){compor(aj.c,$('cvAj'));}
$('ajZoom').oninput=e=>{aj.c.zoom=-e.target.value/100;desenharAj();};
$('ajRot').oninput=e=>{aj.c.rotAj=e.target.value*Math.PI/180;desenharAj();};
$('ajRedet').onclick=async()=>{await detectar(aj.c);aj.c.zoom=0;aj.c.rotAj=0;$('ajZoom').value=0;$('ajRot').value=0;desenharAj();};
$('ajCanc').onclick=()=>{Object.assign(aj.c,aj.bk);$('mAj').classList.remove('on');};
$('ajOk').onclick=()=>{aj.c.auto=true;atualizarSaida(aj.c);$('mAj').classList.remove('on');render();};
(function(){
  const cv=$('cvAj');let drag=null;
  cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing';});
  cv.addEventListener('pointermove',e=>{
    if(!drag)return;const c=aj.c,f=figPorId(c.fig);
    const disp=cv.getBoundingClientRect().width/cv.width;
    const esc=(f.slot[3]*f.h*1.08*2)/(c.face.s*Math.pow(2,c.zoom||0));
    let dx=(e.clientX-drag.x)/disp/esc,dy=(e.clientY-drag.y)/disp/esc;
    const r=c.face.rot-(c.rotAj||0),co=Math.cos(r),si=Math.sin(r);
    c.face.x-=dx*co-dy*si;c.face.y-=dx*si+dy*co;
    drag={x:e.clientX,y:e.clientY};desenharAj();
  });
  const fim=()=>{drag=null;cv.style.cursor='grab';};
  cv.addEventListener('pointerup',fim);cv.addEventListener('pointercancel',fim);
  cv.addEventListener('wheel',e=>{e.preventDefault();const z=$('ajZoom');z.value=Math.max(-100,Math.min(100,+z.value-Math.sign(e.deltaY)*5));z.oninput({target:z});},{passive:false});
})();

// ---------- mural ----------
function prontos(){return colabs.filter(c=>c.out);}
function renderMural(){
  const G=$('muralGrade');const p=prontos();
  G.innerHTML=p.length?'':'<div class="vazio" style="color:#cbd5e1;grid-column:1/-1">Adicione fotos e marque H/M na tela Colaboradores.</div>';
  p.forEach(c=>{const d=document.createElement('div');d.className='mcard';d.innerHTML=`<img src="${c.out}" title="Clique para baixar" style="cursor:pointer"><div></div>`;d.querySelector('img').onclick=()=>baixarUm(c);d.querySelector('div').textContent=c.nome;G.appendChild(d);});
}
async function baixarMural(){
  const p=prontos();if(!p.length){alert('Nenhum colaborador pronto no mural.');return;}
  const cols=Math.min(p.length,Math.ceil(Math.sqrt(p.length*1.4))),cw=320,ch=440,gap=24,pad=40,top=110;
  const rows=Math.ceil(p.length/cols);
  const cv=document.createElement('canvas');cv.width=pad*2+cols*cw+(cols-1)*gap;cv.height=top+pad+rows*ch+(rows-1)*gap;
  const g=cv.getContext('2d');
  const bg=g.createRadialGradient(cv.width/2,0,50,cv.width/2,0,cv.height);bg.addColorStop(0,'#1e40af');bg.addColorStop(1,'#0b1d4f');g.fillStyle=bg;g.fillRect(0,0,cv.width,cv.height);
  g.fillStyle='rgba(255,255,255,.35)';for(let i=0;i<cv.width*cv.height/2500;i++){g.beginPath();g.arc(Math.random()*cv.width,Math.random()*cv.height,Math.random()*2+.5,0,7);g.fill();}
  g.fillStyle='#fff';g.font='800 48px system-ui,sans-serif';g.textAlign='center';g.fillText($('muralTit').innerText.trim(),cv.width/2,72);
  for(const [i,c] of p.entries()){
    const x=pad+(i%cols)*(cw+gap),y=top+Math.floor(i/cols)*(ch+gap);
    g.fillStyle='#fff';g.beginPath();g.roundRect(x,y,cw,ch,18);g.fill();
    const im=await new Promise(r=>{const m=new Image();m.onload=()=>r(m);m.src=c.out;});
    const s=Math.min((cw-20)/im.width,(ch-70)/im.height);const w=im.width*s,h=im.height*s;
    g.drawImage(im,x+(cw-w)/2,y+10+(ch-70-h)/2,w,h);
    g.fillStyle='#dc2626';g.font='700 22px system-ui,sans-serif';g.fillText(c.nome,x+cw/2,y+ch-24,cw-20);
  }
  const a=document.createElement('a');a.download='mural-natal.png';a.href=cv.toDataURL('image/png');a.click();
}

// ---------- figurinhas ----------
function renderFigs(){
  $('figResumo').textContent=`${FIGS.length} figurinhas · ${FIGS.filter(f=>f.sexo==='H').length} H · ${FIGS.filter(f=>f.sexo==='M').length} M`;
  const L=$('figLista');L.innerHTML='';
  FIGS.forEach(f=>{const u=usoFig(f.id);const d=document.createElement('div');d.className='fig';d.style.cursor='default';d.innerHTML=`<img src="${f.src}"><span>${f.id} · ${f.sexo==='H'?'Homem':'Mulher'}${u?` · ${u} em uso`:''}</span>`;L.appendChild(d);});
}

// ---------- navegação ----------
const TELAS={
  colab:{t:'Colaboradores',b:[['📷 Adicionar fotos',()=>$('arq').click()],['🎲 Sortear todos de novo',()=>{colabs.forEach(c=>c.fig=null);colabs.filter(c=>c.sexo).forEach(c=>{sortear(c);atualizarSaida(c);});render();},'sec']],r:render},
  mural:{t:'Mural',b:[['⛶ Tela cheia',()=>$('muralBox').requestFullscreen&&$('muralBox').requestFullscreen()],['⬇ Baixar mural (PNG)',baixarMural,'sec'],['🖨 Imprimir',()=>window.print(),'sec']],r:renderMural},
  figs:{t:'Figurinhas',b:[],r:renderFigs}
};
function ir(t){
  document.querySelectorAll('aside nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  document.querySelectorAll('.tela').forEach(s=>s.classList.toggle('on',s.id==='t-'+t));
  $('titulo').textContent=TELAS[t].t;
  const B=$('barra');B.innerHTML='';TELAS[t].b.forEach(([txt,fn,cls])=>{const b=document.createElement('button');b.className='btn '+(cls||'');b.textContent=txt;b.onclick=fn;B.appendChild(b);});
  TELAS[t].r();
}
document.querySelectorAll('aside nav button').forEach(b=>b.onclick=()=>ir(b.dataset.t));
window.addEventListener('beforeunload',e=>{if(colabs.length){e.preventDefault();e.returnValue='';}});
ir('colab');
</script>
